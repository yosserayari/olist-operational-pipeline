name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: olist_pipeline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d olist_pipeline"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PSYCOPG_IMPL: python
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: olist_pipeline
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PostgreSQL client library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpq5

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare synthetic source data
        run: |
          mkdir -p data/raw
          cp tests/fixtures/olist_minimal/*.csv data/raw/

      - name: Build database with synthetic data
        run: python scripts/run_pipeline.py

      - name: Run all tests
        run: python -m pytest -v